name: Python

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Python syntax without executing game tests
        run: |
          python3 - <<'PY'
          import ast
          import subprocess
          from pathlib import Path

          files = subprocess.check_output(['git', 'ls-files', '-z', '*.py']).decode().split('\0')
          for name in filter(None, files):
              ast.parse(Path(name).read_bytes(), filename=name)
              print('PASS', name)
          PY
      - name: Lint Python with Ruff
        env:
          RUFF_VERSION: 0.17.3
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/astral-sh/ruff/releases/download/${RUFF_VERSION}/ruff-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$RUNNER_TEMP/ruff.tar.gz"
          echo "2b0890f5a55900af741f133918c2656919bbf18c2ab7741b4ca8403a90e647a9  $RUNNER_TEMP/ruff.tar.gz" |
            sha256sum --check
          tar -xzf "$RUNNER_TEMP/ruff.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 ruff-x86_64-unknown-linux-gnu/ruff
          git ls-files -z -- '*.py' | xargs -0 -r "$RUNNER_TEMP/ruff" check --no-cache --config .ruff.toml --
      - name: Test CI change routing
        run: python3 tools/test_ci_changes.py
      - name: Test Pullfrog owner authorization
        run: python3 tools/test_pullfrog_command.py
      - name: Test package source boundaries
        run: python3 tools/test_package.py
      - name: Test installable release and authored notes
        run: python3 tools/test_prepare_release.py
